---
- name: Configure update-motd scripts
  ansible.builtin.template:
    src: "update-motd.d/{{ item }}.j2"
    dest: "/etc/update-motd.d/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  vars:
    php: true
    mod_php7: "{{ amimoto_mod_php7_enabled }}"
  loop:
    - 30-banner
    - 35-middlewares
    - 70-available-updates
    - 75-system-update
  when: amimoto_update_motd_enabled | bool
  notify: Update motd
